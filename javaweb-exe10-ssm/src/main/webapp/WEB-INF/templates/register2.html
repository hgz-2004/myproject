<!DOCTYPE html>
<html lang="cn" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajax 注册</title>
    <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
</head>
<body>
<h2>Ajax 注册</h2>
<label>用户名：<input type="text" id="username" name="username"></label><br>
<label>密码：<input type="password" id="password" name="password"></label><br>
<label>邮箱：<input type="text" id="email" name="email"></label><br>
<input type="button" id="registerBtn" value="注册">
<p id="resMsg"></p>
<a th:href="@{/register}">返回普通注册</a>
<script type="text/javascript">
$(document).ready(function () {
    $("#registerBtn").click(function () {
        var username = $("#username").val().trim();
        var password = $("#password").val().trim();
        var email = $("#email").val().trim();
        $.ajax({
            url: "signup2",
            type: "post",
            contentType: "application/json;charset=UTF-8",
            dataType: "json",
            data: JSON.stringify({username: username, password: password, email: email}),
            success: function (result) {
                $("#resMsg").text(result.errmsg);
            },
            error: function () {
                $("#resMsg").text("注册异常");
            }
        });
    });
});
</script>
</body>
</html>
